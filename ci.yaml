- name: update-v5.2
  plan:
  - in_parallel:
      steps:
      - get: osl
      - get: odp
      - get: platform-automation-v5.2
      - get: docs-platform-automation-v5.2
      - get: docs-platform-automation-with-docs
      - get: version
        params:
          bump: patch
        resource: version-v5.2
      - get: rc-image-s3-vsphere
        params:
          unpack: true
        passed:
        - bump-previous-versions-trigger
      - get: binaries-image
        params:
          unpack: true
        passed:
        - bump-previous-versions-trigger
        resource: rc-image-s3
        trigger: true
      - get: binaries-table
        passed:
        - bump-previous-versions-trigger
  - file: docs-platform-automation-with-docs/ci/tasks/pivnet-release/generate-release-notes.yml
    params:
      GITHUB_SSH_KEY: ((platform_automation_docs.private_key))
