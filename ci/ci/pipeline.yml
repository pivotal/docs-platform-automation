#@ opsman_glob = deployment.opsman_glob
#@ tags = deployment.tags
#@ paving_dir = deployment.paving_dir
- name: #@ env_name + "-delete-infrastructure"
  serial_groups:
  - #@ env_name
  plan:
  - in_parallel:
#@ if deployment.enable_timed_trigger:
    - get: nightly
      trigger: true
      tags: #@ tags
#@ end
    - get: docs-platform-automation
      tags: #@ tags
    - get: paving
      tags: #@ tags
    - get: deployments
      tags: #@ tags
    - get: platform-automation-image
      resource: rc-image-s3
      params:
        unpack: true
      tags: #@ tags
    - get: platform-automation-tasks
      resource: rc-tasks-s3
      params:
        unpack: true
      tags: #@ tags
  - task: prepare-tasks-with-secrets
    tags: #@ tags
    image: platform-automation-image
    file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
    input_mapping:
      config: paving
      tasks: platform-automation-tasks
      vars: deployments
    output_mapping:
      tasks: platform-automation-tasks
    params:
      CONFIG_PATHS: #@ "config/ci/configuration/" + paving_dir + "/director.yml config/ci/configuration/" + paving_dir + "/ops-manager.yml config/ci/configuration/auth.yml"
      VARS_PATHS: #@ "vars/" + env_name + "/terraform-vars.yml"
  - try:
      task: delete-installation
      tags: #@ tags
      file: platform-automation-tasks/tasks/delete-installation.yml
      input_mapping:
        env: deployments
      params:
        ENV_FILE: #@ env_name + "/env.yml"
      image: platform-automation-image
  - try:
      task: delete-opsman-vm
      tags: #@ tags
      file: platform-automation-tasks/tasks/delete-vm.yml
      image: platform-automation-image
      input_mapping:
        image: opsman-image
        state: deployments
        config: paving
        vars: deployments
      params:
        STATE_FILE: #@ env_name + "/state.yml"
        OPSMAN_CONFIG_FILE: #@ "ci/configuration/" + paving_dir + "/ops-manager.yml"
        VARS_FILES: #@ "vars/" + env_name + "/terraform-vars.yml"
      ensure:
        do:
        - task: state-file
          tags: #@ tags
          file: platform-automation-tasks/tasks/make-git-commit.yml
          image: platform-automation-image
          params:
            GIT_AUTHOR_NAME: platform-automation-bot
            GIT_AUTHOR_EMAIL: ((platform-automation/main.platform-automation-email))
            COMMIT_MESSAGE: #@ "delete-vm update state file for " + env_name
            FILE_SOURCE_PATH: state.yml
            FILE_DESTINATION_PATH: #@ env_name + "/state.yml"
          input_mapping:
            repository: deployments
            file-source: generated-state
        - put: deployments
          tags: #@ tags
          params:
            rebase: true
            repository: repository-commit
  - try:
      task: delete-infrastructure
      tags: #@ tags
      file: docs-platform-automation/ci/tasks/delete-infrastructure/task.yml
      params:
        IAAS: #@ paving_dir
        DEPLOYMENT_NAME: #@ env_name
        PLATFORM_AUTOMATION_EMAIL: ((platform-automation/main.platform-automation-email))
      ensure:
        put: deployments
        tags: #@ tags
        params:
          rebase: true
          repository: deployments
  - task: leftovers
    tags: #@ tags
    file: docs-platform-automation/ci/tasks/leftovers.yml
    params:
      BBL_IAAS: #@ paving_dir
      BBL_AWS_ACCESS_KEY_ID: ((platform-automation/main/s3_with_role.access_key_id))
      BBL_AWS_SECRET_ACCESS_KEY: ((platform-automation/main/s3_with_role.secret_access_key))
      BBL_AWS_ASSUME_ROLE: ((platform-automation/main/s3_with_role.role_arn))
      BBL_AWS_REGION: ((platform-automation/main/s3_with_role.region_name))
      BBL_AZURE_CLIENT_ID: ((platform-automation/main/azure.client_id))
      BBL_AZURE_CLIENT_SECRET: ((platform-automation/main/azure.client_secret))
      BBL_AZURE_TENANT_ID: ((platform-automation/main/azure.tenant_id))
      BBL_AZURE_SUBSCRIPTION_ID: ((platform-automation/main/azure.subscription_id))
      BBL_GCP_SERVICE_ACCOUNT_KEY: ((platform-automation/main/gcp.service_account))
      BBL_NSXT_PASSWORD: ((platform-automation/main/nsx.password))
      BBL_NSXT_USERNAME: ((platform-automation/main/nsx.username))
      BBL_NSXT_MANAGER_HOST: ((platform-automation/main/nsx.url))
      FILTER: #@ env_name
      DRY_RUN: false
      NO_CONFIRM: true
  - task: remove-state-files
    tags: #@ tags
    file: docs-platform-automation/ci/tasks/delete-state-file.yml
    params:
      DEPLOYMENT: #@ env_name
      PLATFORM_AUTOMATION_EMAIL: ((platform-automation/main.platform-automation-email))
    ensure:
      put: deployments
      tags: #@ tags
      params:
        rebase: true
        repository: deployments
#@ end

- name: ci-upgrade-delete-infrastructure
  serial_groups:
    - ci-upgrade
  plan:
    - in_parallel:
      - get: nightly
        trigger: true
        tags: [platform-automation]
      - get: docs-platform-automation
        tags: [platform-automation]
      - get: paving
        tags: [platform-automation]
      - get: deployments
        tags: [platform-automation]
      - get: platform-automation-image
        resource: rc-image-s3
        params:
          unpack: true
        tags: [platform-automation]
      - get: platform-automation-tasks
        resource: rc-tasks-s3
        params:
          unpack: true
        tags: [platform-automation]
    - task: prepare-tasks-with-secrets
      tags: [platform-automation]
      image: platform-automation-image
      file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
      input_mapping:
        config: deployments
        tasks: platform-automation-tasks
        vars: deployments
      output_mapping:
        tasks: platform-automation-tasks
      params:
        CONFIG_PATHS: config/ci-upgrade-epc/director.yml config/ci-upgrade-epc/ops-manager.yml config/ci-upgrade-epc/auth.yml
        VARS_PATHS: vars/ci-upgrade-epc/terraform-vars.yml
    - try:
        task: delete-installation
        tags: [platform-automation]
        file: platform-automation-tasks/tasks/delete-installation.yml
        input_mapping:
          env: deployments
        params:
          ENV_FILE:  ci-upgrade-epc/env.yml
        image: platform-automation-image
    - try:
        task: delete-opsman-vm
        tags: [platform-automation]
        file: platform-automation-tasks/tasks/delete-vm.yml
        image: platform-automation-image
        input_mapping:
          image: opsman-image
          state: deployments
          config: deployments
          vars: deployments
        params:
          STATE_FILE: ci-upgrade-epc/state.yml
          OPSMAN_CONFIG_FILE: ci-upgrade-epc/ops-manager.yml
        ensure:
          do:
            - task: state-file
              tags: [platform-automation]
              file: platform-automation-tasks/tasks/make-git-commit.yml
              image: platform-automation-image
              params:
                GIT_AUTHOR_NAME: platform-automation-bot
                GIT_AUTHOR_EMAIL: ((platform-automation/main.platform-automation-email))
                COMMIT_MESSAGE: delete-vm update state file for ci-upgrade-epc
                FILE_SOURCE_PATH: state.yml
                FILE_DESTINATION_PATH:  ci-upgrade-epc/state.yml
              input_mapping:
                repository: deployments
                file-source: generated-state
            - put: deployments
              tags: [platform-automation]
              params:
                rebase: true
                repository: repository-commit
    - task: remove-state-files
      tags: [platform-automation]
      file: docs-platform-automation/ci/tasks/delete-state-file.yml
      params:
        DEPLOYMENT: ci-upgrade-epc
        PLATFORM_AUTOMATION_EMAIL: ((platform-automation/main.platform-automation-email))
      ensure:
        put: deployments
        tags: [platform-automation]
        params:
          rebase: true
          repository: deployments

- name: check-for-secrets-in-tasks
  plan:
  - in_parallel:
    - get: daily
      trigger: true
    - get: deployments
    - get: docs-platform-automation
  - task: check-for-secrets
    file: docs-platform-automation/ci/tasks/secrets-verifier/task.yml
    params:
      FLY_USERNAME: ((platform-automation/main/fly.username))
      FLY_PASSWORD: ((platform-automation/main/fly.password))
      FLY_TARGET: ((platform-automation/main/fly.target))
      SECRET_ALLOWLIST: ((platform-automation/main/ci.secret-allowlist))
- name: additional-task-testing
  serial: true
  plan:
  - in_parallel:
    - get: docs-platform-automation
    - get: os-conf-release
    - get: docs-platform-automation-reference-pipeline-config
    - get: rc-image-s3-vsphere
    - get: platform-automation-image
      resource: rc-image-s3
      params:
        unpack: true
      trigger: true
    - get: platform-automation-tasks
      resource: rc-tasks-s3
      params:
        unpack: true
      trigger: true
    - get: binaries-table
      passed:
      - build-binaries-image-combined
    - get: pas-windows
      params:
        globs:
          - '*.pivotal'
  - task: credhub-interpolate
    image: platform-automation-image
    file: platform-automation-tasks/tasks/credhub-interpolate.yml
    input_mapping:
      files: docs-platform-automation-reference-pipeline-config
    output_mapping:
      interpolated-files: env
    params:
      CREDHUB_CLIENT: ((platform-automation/main.credhub-client))
      CREDHUB_SECRET: ((platform-automation/main.credhub-secret))
      CREDHUB_SERVER: ((platform-automation/main.credhub-server))
      CREDHUB_CA_CERT: ((platform-automation/main.credhub-ca-cert))
      PREFIX: /concourse/main/reference-pipeline
      INTERPOLATION_PATHS: .
  - in_parallel:
    - do:
      - task: ensure-clis-versions-run
        image: platform-automation-image
        config:
          platform: linux
          run:
            path: bash
            args:
            - -c
            - |
              set -eux

              # IAASes
              openstack --version
              govc version
              az --version
              gcloud --version
              aws --version

              # vmware owned
              bosh --version
              credhub --version
              winfs-injector --help
              om --version
    - do:
      - task: replicate-product
        image: platform-automation-image
        file: platform-automation-tasks/tasks/replicate-product.yml
        input_mapping:
          product: pas-windows
        params:
          REPLICATED_NAME: awesome
      - task: check-replicated-tile
        image: platform-automation-image
        config:
          platform: linux
          inputs:
          - name: replicated-product
          run:
            path: bash
            args:
              - -c
              - |
                set -eux

                test -e replicated-product/awesome.pivotal
                unzip -t replicated-product/awesome.pivotal

    - do:
      - task: get-ca-cert
        image: platform-automation-image
        config:
          platform: linux
          outputs:
            - name: config
          run:
            path: bash
            args:
              - -c
              - |
                set -eux

                echo quit | openssl s_client -showcerts \
                  -servername self-signed.badssl.com \
                  -connect self-signed.badssl.com:443 > config/cacert.pem
      - task: prepare-image
        image: platform-automation-image
        file: platform-automation-tasks/tasks/prepare-image.yml
        params:
          CA_CERT_FILES: cacert.pem
      - task: test-ca-cert-worked
        image: platform-automation-image
        config:
          platform: linux
          run:
            path: bash
            args:
              - -c
              - |
                set -eux

                curl -vvv -L https://self-signed.badssl.com
    - do:
      - task: download-and-upload-product
        image: platform-automation-image
        file: platform-automation-tasks/tasks/download-and-upload-product.yml
        input_mapping:
          config: env
        params:
          ENV_FILE: foundations/config/env.yml
          CONFIG_FILE: download-product-pivnet/download-healthwatch.yml
    - do:
      - task: backup-director
        image: platform-automation-image
        file: platform-automation-tasks/tasks/backup-director.yml
        params:
          ENV_FILE: foundations/config/env.yml
          OPSMAN_SSH_PRIVATE_KEY: ((platform-automation/main/reference-pipeline.ops_manager_ssh_private_key))
      - task: check-backup-director
        image: platform-automation-image
        config:
          platform: linux
          inputs:
            - name: backup
          run:
            path: bash
            args:
              - -c
              - |
                set -eux

                test -e backup/director_*.tgz
                tar -tzf  backup/director_*.tgz > /dev/null
    - do:
      - task: update-runtime-config
        image: platform-automation-image
        file: platform-automation-tasks/tasks/update-runtime-config.yml
        input_mapping:
          config: docs-platform-automation
          releases: os-conf-release
        params:
          ENV_FILE: foundations/config/env.yml
          CONFIG_FILE: ci/config/runtime-config.yml
          NAME: my-runtime-config
          BOSH_ENV_PREFIX: OPSMAN
          OPSMAN_SSH_PRIVATE_KEY: ((platform-automation/main/reference-pipeline.ops_manager_ssh_private_key))

#! bump jobs
- name: bump-previous-versions-trigger
  serial: true
  plan:
  - in_parallel:
    - get: rc-image-s3-vsphere
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
      - additional-task-testing
    - get: binaries-image
      resource: rc-image-s3
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
      - additional-task-testing
      params:
        unpack: true
    - get: binaries-table
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
      - additional-task-testing
- name: bump-test-image-dependency-stability
  plan:
  - in_parallel:
    - get: docs-platform-automation
    - get: binaries-image
      resource: rc-image-s3
      passed: [ bump-previous-versions-trigger ]
      trigger: true
      params:
        unpack: true
    - get: osl-validated-image-receipt-s3
  - task: generate-stub-version
    config:
      image_resource:
        type: registry-image
        source:
          repository: ((concourse-team/dev_image_registry.dev_url))/internalpcfplatformautomation/ci
          tag: testing
          username: ((concourse-team/dev_image_registry.username))
          password: ((concourse-team/dev_image_registry.password))
      platform: linux
      outputs:
      - name: version
      run:
        path: bash
        args:
        - -c
        - |
          set -eux
          echo "test" > version/version
  - task: generate-dpkg-list-for-osl
    file: docs-platform-automation/ci/tasks/generate-dpkg-list-for-OSL.yml
    image: binaries-image
  - task: check-osl-reuse-validity
    file: docs-platform-automation/ci/tasks/check-osl-reuse-validity.yml
#@ for version in data.values.versions:
- name: #@ "update-" + version.number
  serial_groups: [ bump ]
  plan:
  - in_parallel:
    - get: osl
    - get: odp
    - get: #@ "platform-automation-" + version.number
    - get: #@ "docs-platform-automation-" + version.number
    - get: docs-platform-automation-with-docs
    - get: version
      resource: #@ "version-" + version.number
      params:
        bump: patch
    - get: rc-image-s3-vsphere
      passed: [ bump-previous-versions-trigger ]
      params:
        unpack: true
    - get: binaries-image
      resource: rc-image-s3
      passed: [ bump-previous-versions-trigger ]
      trigger: true
      params:
        unpack: true
    - get: binaries-table
      passed: [ bump-previous-versions-trigger ]
  - task: create-release-notes-for-patch
    file: docs-platform-automation-with-docs/ci/tasks/pivnet-release/generate-release-notes.yml
    params:
      GITHUB_SSH_KEY: ((platform-automation/main/platform_automation_docs.private_key))
  - task: create-release-file
    file: docs-platform-automation-with-docs/ci/tasks/package-for-release/platform-automation.yml
    input_mapping:
      docs-platform-automation: docs-platform-automation-with-docs
      platform-automation: #@ "platform-automation-" + version.number
      platform-automation-image: binaries-image
      #@ if version.vsphere_image:
      vsphere-platform-automation-image: rc-image-s3-vsphere
      #@ end
  - in_parallel:
    - task: test-docker-import
      privileged: true
      file: docs-platform-automation-with-docs/ci/tasks/test-docker-import/task.yml
    - task: test-task
      file: #@ "platform-automation-" + version.number + "/tasks/test.yml"
      image: platform-automation-image
      input_mapping:
        platform-automation-tasks: #@ "platform-automation-" + version.number
    - task: generate-dpkg-list-for-osl
      file: docs-platform-automation-with-docs/ci/tasks/generate-dpkg-list-for-OSL.yml
      image: binaries-image
  - in_parallel:
    - put: #@ "platform-automation-" + version.number
      params:
        repository: #@ "platform-automation-" + version.number
        tag: version/version
        tag_prefix: v
        rebase: true
    - put: image-receipt-s3
      params:
        file: rc-image-receipt-s3/image-receipt-*
        acl: public-read
  - put: #@ "rc-artifacts-s3-" + version.number
    params:
      file: packaged-product/artifacts-*.tar.gz
  - put: #@ "version-" + version.number
    params:
      file: version/version
- name: #@ "submit-release-sboms-" + version.number
  plan:
    - in_parallel:
      - get: #@ "rc-artifacts-s3-" + version.number
        passed:
        - #@ "update-" + version.number
        trigger: true
      - get: docs-platform-automation-with-docs
      - get: tvs-cli
      - get: version
        resource: #@ "version-" + version.number
    - task: submit-release-sbom
      file: docs-platform-automation-with-docs/ci/tasks/scan-and-submit-sboms.yml
      input_mapping:
        packaged-product: #@ "rc-artifacts-s3-" + version.number
#@ end
- name: submit-release-sboms-v5.x
  plan:
  - in_parallel:
      steps:
      - get: rc-artifacts-s3-v5
        passed:
        - bump-minor
        trigger: true
      - get: docs-platform-automation-with-docs
      - get: tvs-cli
      - get: version
        resource: version-v5.x
  - task: submit-release-sbom
    file: docs-platform-automation-with-docs/ci/tasks/scan-and-submit-sboms.yml
    input_mapping:
      packaged-product: rc-artifacts-s3-v5

- name: submit-sboms-rc
  plan:
    - in_parallel:
        steps:
          - get: rc-artifacts-s3
            trigger: true
            passed:
              - build-binaries-image-combined
          - get: docs-platform-automation-with-docs
          - get: tvs-cli
          - get: version
    - task: submit-sbom-rc
      file: docs-platform-automation-with-docs/ci/tasks/scan-and-submit-sboms.yml
      input_mapping:
        packaged-product: rc-artifacts-s3

- name: empty-cve-patch-notes-file
  plan:
    - in_parallel:
      - get: rc-image-s3
        passed:
        #@ for version in data.values.versions:
        - #@ "update-" + version.number
        #@ end
        trigger: true
      - get: docs-platform-automation-with-docs
    - task: empty-cve-patch-notes
      file: docs-platform-automation-with-docs/ci/tasks/pivnet-release/empty-cve-patch-notes.yml
      input_mapping:
        docs-platform-automation: docs-platform-automation-with-docs
    - put: docs-platform-automation-with-docs
      params:
        repository: docs-platform-automation
        rebase: true
#@ for bump in ["patch", "minor", "major"]:
- name: #@ "bump-om-" + bump
  plan:
  - in_parallel:
    - get: om
      passed:
      - download-and-test-om
    - get: om-version
      params:
        bump: #@ bump
  - put: om
    params:
      repository: om
      only_tag: true
      tag: om-version/version
  - task: build
    file: om/ci/tasks/build/task.yml
    params:
      GITHUB_TOKEN: ((platform-automation/main/om.access_token))
  - put: om-version
    params:
      bump: #@ bump
#@ end
