        config: deployments
        vars: deployments
      params:
        STATE_FILE: ci-upgrade-epc/state.yml
        OPSMAN_CONFIG_FILE: ci-upgrade-epc/ops-manager.yml
      image: platform-automation-image
      ensure:
        do:
          - task: state-file
