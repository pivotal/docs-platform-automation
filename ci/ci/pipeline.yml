- name: test-image-dependency-stability
  plan:
  - in_parallel:
    - get: docs-platform-automation
    - get: binaries-image
      resource: rc-image-s3
      passed: [ build-binaries-image-combined ]
      trigger: true
      params:
        unpack: true
    - get: osl-validated-image-receipt-s3
  - task: generate-stub-version
    config:
      image_resource:
        type: registry-image
        source:
          repository: ((concourse-team/dev_image_registry.dev_url))/internalpcfplatformautomation/ci
          tag: testing
          username: ((concourse-team/dev_image_registry.username))
          password: ((concourse-team/dev_image_registry.password))

      platform: linux
      outputs:
      - name: version
      run:
        path: bash
        args:
        - -c
        - |
          set -eux
          echo "test" > version/version
  - task: generate-dpkg-list-for-osl
    file: docs-platform-automation/ci/tasks/generate-dpkg-list-for-OSL.yml
    image: binaries-image
  - task: check-osl-reuse-validity
    file: docs-platform-automation/ci/tasks/check-osl-reuse-validity.yml
- name: bump-version-to-major
  plan:
  - put: version
    params:
      bump: major
- name: bump-minor
  plan:
  - in_parallel:
    - get: osl
    - get: odp
    - get: docs-platform-automation
    - get: rc-image-s3
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
      - additional-task-testing
      params:
        unpack: true
    - get: rc-image-s3-vsphere
      params:
        unpack: true
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
      - additional-task-testing
    - get: platform-automation-tasks
      resource: rc-tasks-s3
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
    - get: version-ci
      resource: version
      passed:
      #@ for/end deployment in deployments_without_gcp:
      - #@ "run-tasks-in-" + deployment.env_name + "-job"
      - upgrade-opsman-epc
    - get: version
      resource: version-v5.x
  - task: create-release-file
    file: docs-platform-automation/ci/tasks/package-for-release/platform-automation.yml
    input_mapping:
      platform-automation-image: rc-image-s3
      vsphere-platform-automation-image: rc-image-s3-vsphere
  - task: test-docker-import
    privileged: true
    file: docs-platform-automation/ci/tasks/test-docker-import/task.yml
  - task: generate-dpkg-list-for-osl
    file: docs-platform-automation/ci/tasks/generate-dpkg-list-for-OSL.yml
    image: rc-image-s3
  - put: docs-platform-automation
    params:
      repository: docs-platform-automation
      tag: version/version
      tag_prefix: v
  - put: version
    resource: version-v5.x
    params:
      bump: minor
  - put: version-ci
    resource: version
    params:
      bump: minor
  - put: image-receipt-s3
    params:
      file: rc-image-receipt-s3/image-receipt-*
      acl: public-read
  - params:
      file: packaged-product/artifacts-*.tar.gz
    put: rc-artifacts-s3-v5
- name: prepare-resource-for-reference-pipeline
  serial_groups:
  - image
  - task
  plan:
  - in_parallel:
    - get: rc-image-s3
      passed:
      - build-binaries-image-combined
      trigger: true
    - get: rc-tasks-s3
      passed:
      - build-binaries-image-combined
      trigger: true
  - in_parallel:
    - put: platform-automation-image-s3
      params:
        file: rc-image-s3/platform-automation-image-*.tgz
      get_params:
        skip_download: "true"
    - put: platform-automation-tasks-s3
      params:
        file: rc-tasks-s3/platform-automation-tasks-*.zip
      get_params:
        skip_download: "true"
- name: upgrade-opsman-epc
  serial: true
  serial_groups: [ ci-upgrade ]
  plan:
  - in_parallel:
    - get: version
      tags: [platform-automation]
      passed:
        - build-binaries-image-combined
    - get: platform-automation-tasks
      tags: [platform-automation]
      resource: rc-tasks-s3
      params:
        unpack: true
      passed:
      - build-binaries-image-combined
    - get: binaries-table
      tags: [platform-automation]
      passed:
      - build-binaries-image-combined
    - get: paving
      tags: [platform-automation]
    - get: docs-platform-automation
      tags: [platform-automation]
    - get: deployments
      tags: [platform-automation]
    - get: platform-automation-image
      tags: [platform-automation]
      resource: rc-image-s3
      trigger: true
      params:
        unpack: true
      passed:
      - build-binaries-image-combined
    - get: rc-image-s3-vsphere
      tags: [platform-automation]
      passed:
      - build-binaries-image-combined
    - get: opsman-image-2.9.42
      tags: [platform-automation]
      params:
        globs:
        - '*.ova'
    - get: opsman-image-2.9.x
      tags: [platform-automation]
      params:
        globs:
        - '*.ova'
    - get: opsman-image
      tags: [platform-automation]
      trigger: true
      params:
        globs:
        - '*.ova'
  - task: prepare-tasks-with-secrets
    tags: [platform-automation]
    image: platform-automation-image
    file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
    input_mapping:
      config: deployments
      tasks: platform-automation-tasks
      vars: deployments
    output_mapping:
      tasks: platform-automation-tasks
    params:
      CONFIG_PATHS: config/ci-upgrade-epc/director.yml config/ci-upgrade-epc/auth.yml
  - in_parallel:
