          FILE_SOURCE_PATH: state.yml
          FILE_DESTINATION_PATH: #@ env_name + "/state.yml"
        input_mapping:
          repository: deployments
          file-source: generated-state
        image: platform-automation-image
      - put: deployments
        tags: #@ tags
        params:
          rebase: true
          repository: repository-commit
  - task: configure-authentication
    tags: #@ tags
    file: platform-automation-tasks/tasks/configure-authentication.yml
    image: platform-automation-image
    attempts: 20
    input_mapping:
      env: deployments
      config: paving
    params:
      ENV_FILE: #@ env_name + "/env.yml"
      AUTH_CONFIG_FILE: ci/configuration/auth.yml
      VARS_FILES: #@ "env/" + env_name + "/terraform-vars.yml"
  - task: staged-director-config
    tags: #@ tags
    file: platform-automation-tasks/tasks/staged-director-config.yml
    image: platform-automation-image
    input_mapping:
      env: deployments
    params:
      ENV_FILE: #@ env_name + "/env.yml"
  - task: configure-director
    tags: #@ tags
    file: platform-automation-tasks/tasks/configure-director.yml
    image: platform-automation-image
    input_mapping:
      env: deployments
      config: paving
    params:
      ENV_FILE: #@ env_name + "/env.yml"
      VARS_FILES: #@ "env/" + env_name + "/terraform-vars.yml"
      DIRECTOR_CONFIG_FILE: #@ "ci/configuration/" + paving_dir + "/director.yml"
  - task: apply-director-changes
    tags: #@ tags
    file: platform-automation-tasks/tasks/apply-director-changes.yml
    image: platform-automation-image
    input_mapping:
      env: deployments
    params:
      ENV_FILE: #@ env_name + "/env.yml"
  - task: staged-director-config
    tags: #@ tags
    file: platform-automation-tasks/tasks/staged-director-config.yml
    image: platform-automation-image
    input_mapping:
      env: deployments
    params:
      ENV_FILE: #@ env_name + "/env.yml"
  - task: delete-installation
    tags: #@ tags
    file: platform-automation-tasks/tasks/delete-installation.yml
    image: platform-automation-image
    input_mapping:
      env: deployments
    params:
      ENV_FILE: #@ env_name + "/env.yml"
  - task: #@ "delete-" + env_name + "-opsman-vm"
    tags: #@ tags
    file: platform-automation-tasks/tasks/delete-vm.yml
    input_mapping:
      state: generated-state
      config: paving
      vars: deployments
    params:
      OPSMAN_CONFIG_FILE: #@ "ci/configuration/" + paving_dir + "/ops-manager.yml"
      VARS_FILES: #@ "vars/" + env_name + "/terraform-vars.yml"
    image: platform-automation-image
    ensure:
      do:
      - task: state-file
        tags: #@ tags
        file: platform-automation-tasks/tasks/make-git-commit.yml
        params:
          GIT_AUTHOR_NAME: platform-automation-bot
          GIT_AUTHOR_EMAIL: ((platform-automation/main.platform-automation-email))
          COMMIT_MESSAGE: #@ "delete-vm update state file for " + env_name
          FILE_SOURCE_PATH: state.yml
          FILE_DESTINATION_PATH: #@ env_name + "/state.yml"
        input_mapping:
          repository: deployments
          file-source: generated-state
        image: platform-automation-image
      - put: deployments
        tags: #@ tags
        params:
          rebase: true
          repository: repository-commit
#@ end

#@ for deployment in data.values.deployments:
