#@ env_name = deployment.env_name
#@ opsman_glob = deployment.opsman_glob
#@ tags = deployment.tags
#@ paving_dir = deployment.paving_dir
- name: #@ "run-tasks-in-" + env_name + "-job"
  serial: true
  serial_groups:
  - #@ env_name
  plan:
  - in_parallel:
    - get: version
      passed:
      - build-binaries-image-combined
      tags: #@ tags
    - get: platform-automation-tasks
      resource: rc-tasks-s3
      passed:
      - build-binaries-image-combined
      params:
        unpack: true
      tags: #@ tags
    - get: binaries-table
      passed:
      - build-binaries-image-combined
      tags: #@ tags
    - get: docs-platform-automation
      tags: #@ tags
    - get: paving
      tags: #@ tags
    - get: deployments
      tags: #@ tags
#@ if deployment.paving_dir == "nsxt":
    - get: platform-automation-image
      passed: [ build-binaries-image-combined ]
      resource: rc-image-s3-vsphere
      tags: #@ tags
      params:
        unpack: true
    - get: rc-image-s3
      passed: [ build-binaries-image-combined ]
      trigger: true
      params:
        unpack: true
      tags: #@ tags
#@ else:
    - get: platform-automation-image
      passed: [ build-binaries-image-combined ]
      resource: rc-image-s3
      tags: #@ tags
      params:
        unpack: true
    - get: rc-image-s3-vsphere
      passed: [ build-binaries-image-combined ]
      trigger: true
      params:
        unpack: true
      tags: #@ tags
#@ end
    - get: opsman-image
      trigger: true
      params:
        globs:
        - #@ opsman_glob
      tags: #@ tags
  - task: run-terraform
    attempts: 2
    tags: #@ tags
    file: docs-platform-automation/ci/tasks/create-infrastructure/task.yml
    params:
      IAAS: #@ paving_dir
      DEPLOYMENT_NAME: #@ env_name
      OM_PASSWORD: ((platform-automation/main/opsman-login.password))
      OM_USERNAME: ((platform-automation/main/opsman-login.username))
      PLATFORM_AUTOMATION_EMAIL: ((platform-automation/main.platform-automation-email))
    ensure:
      put: deployments
      tags: #@ tags
      params:
        rebase: true
        repository: deployments
  - task: prepare-tasks-with-secrets
    tags: #@ tags
    image: platform-automation-image
    file: platform-automation-tasks/tasks/prepare-tasks-with-secrets.yml
    input_mapping:
      config: paving
      tasks: platform-automation-tasks
      vars: deployments
    output_mapping:
      tasks: platform-automation-tasks
    params:
