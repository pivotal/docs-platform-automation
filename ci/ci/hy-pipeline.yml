  - bump-minor
  - submit-release-sboms-v5.x
- name: patch-bump
  jobs:
  - bump-test-image-dependency-stability
  - bump-previous-versions-trigger
  - update-v5.2
  - update-v5.3
  - submit-release-sboms-v5.2
  - submit-release-sboms-v5.3
  - empty-cve-patch-notes-file
- name: om
