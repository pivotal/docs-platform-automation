jobs:
- name: build-ci-image
  plan:
  - get: daily
    trigger: true
  - get: docs-platform-automation
  - get: golang-image
    trigger: true
    attempts: 3
    params:
      format: oci
  - task: build-ci-image
    privileged: true
    file: docs-platform-automation/ci/tasks/build-oci-image.yml
    input_mapping:
      base-image: golang-image
    params:
      DOCKERFILE: docs-platform-automation/ci/dockerfiles/Dockerfile.ci
      IMAGE_ARG_base_image: base-image/image.tar
  - put: ci-image
    params:
      image: image/image.tar
    get_params:
      skip_download: true
- name: build-packages-image
  plan:
  - get: daily
    trigger: true
  - get: docs-platform-automation
  - get: builder-jammy-buildpackless-tiny-image
    trigger: true
    attempts: 3
    params:
      format: oci
  - task: build-packages-image
    privileged: true
    file: docs-platform-automation/ci/tasks/build-oci-image.yml
    input_mapping:
      base-image: builder-jammy-buildpackless-tiny-image
    params:
      DOCKERFILE: docs-platform-automation/ci/dockerfiles/Dockerfile.packages
      IMAGE_ARG_base_image: base-image/image.tar
  - put: packages-image
    params:
      image: image/image.tar
- name: download-and-test-om
  plan:
  - get: daily
    trigger: true
  - get: om
  - get: docs-platform-automation
  - task: download-product
    params:
      OM_pivnet_token: ((platform-automation/main.pivnet_token))
    file: docs-platform-automation/ci/tasks/download-product.yml
  - task: test
    attempts: 3
    file: docs-platform-automation/ci/tasks/test-and-build-om.yml
- name: build-binaries-image-combined
  serial_groups:
  - image
  - task
  plan:
  - in_parallel:
    - get: osl
    - get: govc-cli
      trigger: true
      params:
        globs:
        - govc_Linux_x86_64*
    - get: bosh-cli
      trigger: true
      params:
        globs:
        - '*linux-amd*'
    - get: credhub-cli
      trigger: true
      params:
        globs:
        - '*linux*'
    - get: bbr-cli
      trigger: true
      params:
        globs:
        - bbr-[^s3]*-linux-amd64
    - get: winfs-injector
      trigger: true
      params:
        globs:
        - '*linux'
    - get: isolation-segment-replicator
      trigger: true
      params:
        globs:
        - '*linux'
