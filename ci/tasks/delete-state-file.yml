---
platform: linux
image_resource:
  type: registry-image
  source:
    repository: ((concourse-team/dev_image_registry.dev_url))/internalpcfplatformautomation/ci
    tag: testing
    username: ((concourse-team/dev_image_registry.username))
    password: ((concourse-team/dev_image_registry.password))

inputs:
- name: deployments
outputs:
- name: deployments
params:
  DEPLOYMENT:

run:
  path: bash
  args:
    - -c
    - |
      set -eux

      cd deployments/"$DEPLOYMENT"
      rm -Rf state.yml
      rm -Rf terraform.tfstate

      git config --global user.name "platform-automation-bot"
      git config --global user.email "$PLATFORM_AUTOMATION_EMAIL"
      git add -A
      git commit -m "removed state for $DEPLOYMENT" || true
