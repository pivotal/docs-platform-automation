platform: linux
image_resource:
  type: docker-image
  source:
    repository: ((concourse-team/dev_image_registry.url))/golang
    username: ((concourse-team/dev_image_registry.username))
    password: ((concourse-team/dev_image_registry.password))
inputs:
  - name: rmt-artifacts
  - name: rmt-release-config
  - name: release-created
  - name: docs-platform-automation
  - name: packaged-product
  # OSL license file fetched from the release_candidate S3 bucket via the
  # `osl-{version}` Concourse resource. Mounted here so release-files-update
  # can include `../osl/open_source_license_..._<version>_GA.txt` as the 4th
  # release file. Path-mapped to `osl` via the job's input_mapping.
  - name: osl
run:
  path: sh
  args:
    - -exc
    - |
      apt-get update -qq && apt-get install -qqy make curl jq
      
      RELEASE_ID="$(cat release-created/id)"
      
      cd rmt-artifacts
      # Expected file count was bumped from 3 -> 4 when the OSL license file
      # (open_source_license_..._<version>_GA.txt) was added as the 4th file
      # in pa-release-files.yml.template.
      EXPECTED_FILES=4
      while true; do
        release=$(./rmt release-get --id ${RELEASE_ID} --output json)
        files_length=$(echo "$release" | jq '.Files | length')

        if [ "$files_length" -eq "$EXPECTED_FILES" ]; then
        break
        fi

        echo "Files length is ${files_length}, expected ${EXPECTED_FILES}. Waiting..."
        sleep 30
      done
    
      cp ../rmt-release-config/pa-release-${VERSION}.yml release.yml
      cp ../rmt-release-config/pa-release-files-${VERSION}.yml release-files.yml

      sed -i 's|Dev/Internal|GA|g' release-files.yml

      cat ../rmt-release-config/pa-release-files-${VERSION}.yml >> release.yml
      cat release.yml
      ./rmt release-update --release-file release.yml --id ${RELEASE_ID}
      
      # Check for the virus scan status on release files
      ./rmt release-file-check --id ${RELEASE_ID}
      ./rmt release-file-update --release-file release.yml --id ${RELEASE_ID}
