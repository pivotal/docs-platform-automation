# The inputs, outputs, params, filename, and filepath
# of this task file are part of its semantically versioned API.
# See our documentation for a detailed discussion of our semver API.
# See www.semver.org for an explanation of semantic versioning.

# code_snippet replicate-uploaded-product start yaml
---
platform: linux

inputs:
- name: platform-automation-tasks
- name: product # contains the product file; name and version are read from the tile
  optional: true
- name: config # contains a file with product name, version, and replica-suffix to be replicated
  optional: true
- name: env # contains the env file with target OpsMan Information

params:
  ENV_FILE: env.yml
  # - Required
  # - Filepath of the env config YAML
  # - The path is relative to root of the `env` input

  CONFIG_FILE:
  # - Optional
  # - Filepath of the replicate-product config YAML
  # - Used when the product input is not provided
  # - The path is relative to root of the `config` input
  # - Example config:
  # ---
  # product-name: p-isolation-segment
  # product-version: 10.4.0-build.7
  # replica-suffix: iso-1

  REPLICA_SUFFIX:
  # - Optional (required when product input is provided)
  # - Suffix for the new staged replica product

run:
  path: platform-automation-tasks/tasks/replicate-uploaded-product.sh
# code_snippet replicate-uploaded-product end
